  .header h2 { margin: 0; font-size: 1.2em; }
  .kur-bilgi { font-size: 0.75em; margin-top: 6px; opacity: 0.85; }

  .category-card h3 { margin: 0; font-size: 1.2em; color: #0056b3; font-weight: 700; text-align: center; }
  .category-card .icon { font-size: 1.6em; margin-right: 12px; }

  .back-btn { background: #0056b3; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 0.95em; cursor: pointer; margin-bottom: 12px; display: inline-block; }
  .back-btn:active { opacity: 0.8; }

  .cat-title { font-size: 1.15em; color: #0056b3; font-weight: 700; margin: 5px 0 12px 0; text-align: center; padding: 10px; background: white; border-radius: 8px; cursor: pointer; user-select: none; }

  .product-card { display: flex; background: white; padding: 12px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); align-items: flex-start; gap: 12px; }
  .product-img { width: 85px; height: 85px; object-fit: contain; border-radius: 6px; background-color: #f9f9f9; border: 1px solid #eee; cursor: pointer; flex-shrink: 0; padding: 4px; }
  .product-info { flex: 1; display: flex; flex-direction: column; }
  .product-code { font-weight: bold; color: #0056b3; font-size: 1.0em; }
  .product-desc { font-size: 0.78em; color: #555; margin: 3px 0; }
  .prices { display: flex; flex-direction: column; margin-top: auto; padding-top: 6px; font-size: 0.8em; border-top: 1px dashed #eee; gap: 3px; }
  .price-row { display: flex; justify-content: space-between; align-items: center; }
  .euro-price { color: #333; font-weight: bold; }
  .list-price-tl { color: #666; font-weight: bold; }
  .tl-price { color: #28a745; font-weight: bold; font-size: 1.05em; }
  .separator { border-top: 1px dotted #ccc; margin-top: 3px; padding-top: 3px; }
  .discount-section { display: none; margin-top: 8px; padding: 8px; background: #ffe6e6; border-left: 3px solid #dc3545; border-radius: 4px; font-size: 0.85em; }
  .discount-text { color: #dc3545; font-weight: bold; }
  .subgroup-title { font-size: 0.9em; font-weight: 700; color: #444; margin: 15px 0 8px 0; padding-bottom: 4px; border-bottom: 1px solid #ddd; }

      { code: "HCMA-S", desc: "Şapkalı Elektrikli Araç Şarj İstasyonu Pedestalı", euroPrice: 310, sitePrice: null, group: "Standlar" },
      { code: "HCS01", desc: "Metal Ürün Tanıtım Standı Tekerlekli", euroPrice: 500, sitePrice: null, group: "Standlar" },

      { code: "HCB4010", desc: "Kablo Çantası", euroPrice: 39, sitePrice: null, group: "Çantalar" },
      { code: "HCBV2L2010", desc: "V2L Çantası", euroPrice: 17, sitePrice: null, group: "Çantalar" },
      { code: "HCTB45", desc: "Taşınabilir İstasyon Çantası", euroPrice: 45, sitePrice: null, group: "Çantalar" }
    ]
  }
};

const KDV_ORANI = 1.20;
// Fallback: senin verdiğin HTML kaynağındaki EUR_TO_TL değeri
let currentEuroRate = 55.60;
let currentEuroRateSource = "sabit (son bilinen)";
let secretModeActive = false;
let catTapCount = 0;
let catTapTimer;
let currentCategory = null;

// TCMB Efektif Satış Kuru Çekme (3 farklı proxy dener)
async function fetchTCMBEuroRate() {
  const tcmbUrl = "https://www.tcmb.gov.tr/kurlar/today.xml";
  const proxies = [
    { url: `https://api.allorigins.win/raw?url=${encodeURIComponent(tcmbUrl)}`, type: "text" },
    { url: `https://corsproxy.io/?${encodeURIComponent(tcmbUrl)}`, type: "text" },
    { url: `https://api.allorigins.win/get?url=${encodeURIComponent(tcmbUrl)}`, type: "json" }
  ];

  for (const proxy of proxies) {
    try {
      const res = await fetch(proxy.url);
      if (!res.ok) continue;
      let xmlText;
      if (proxy.type === "json") {
        const data = await res.json();
        xmlText = data.contents;
      } else {
        xmlText = await res.text();
      }
      if (!xmlText || xmlText.length < 100) continue;

      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const eurNode = xmlDoc.querySelector('Currency[Kod="EUR"]');
      if (eurNode) {
        const banknoteSelling = eurNode.querySelector("BanknoteSelling")?.textContent;
        if (banknoteSelling && parseFloat(banknoteSelling) > 0) {
          currentEuroRate = parseFloat(banknoteSelling);
          currentEuroRateSource = "TCMB Efektif Satış";
          console.log("✅ TCMB EUR Efektif Satış:", currentEuroRate);
          break;
        }
      }
    } catch (e) {
      console.warn("Proxy başarısız:", proxy.url, e.message);
    }
  }

  document.getElementById("kurBilgi").textContent =
    `1 € = ${currentEuroRate.toFixed(4)} ₺ (${currentEuroRateSource})`;

  if (currentCategory) renderProducts(currentCategory);
}

function showCategory(key) {
  currentCategory = key;
  document.getElementById("homeView").style.display = "none";
  document.getElementById("categoryView").style.display = "block";
  const catTitleEl = document.getElementById("catTitle");
  catTitleEl.textContent = categories[key].title;
  renderProducts(key);
  attachCatTitleTap();
  window.scrollTo(0, 0);
}

function showHome() {
  currentCategory = null;
  document.getElementById("categoryView").style.display = "none";
  document.getElementById("homeView").style.display = "block";
  window.scrollTo(0, 0);
}

// Kategori başlığına 2 tıklama -> gizli iskonto modu
function attachCatTitleTap() {
  const catTitle = document.getElementById("catTitle");
  // Dinleyiciyi sıfırlamak için klonla
  const clone = catTitle.cloneNode(true);
  catTitle.parentNode.replaceChild(clone, catTitle);
  catTapCount = 0;
  clone.addEventListener("click", () => {
    catTapCount++;
    clearTimeout(catTapTimer);
    catTapTimer = setTimeout(() => { catTapCount = 0; }, 500);
    if (catTapCount === 2) {
      secretModeActive = !secretModeActive;
      catTapCount = 0;
      document.querySelectorAll(".discount-section").forEach(el => {
        el.style.display = secretModeActive ? "block" : "none";
      });
      // Görsel geri bildirim
      clone.style.background = secretModeActive ? "#fff3cd" : "white";
    }
  });
}

function renderProducts(catKey) {
  const listContainer = document.getElementById("productList");
  listContainer.innerHTML = "";
  const products = categories[catKey].products;
  let lastGroup = null;

  products.forEach((product, index) => {
    if (catKey === "aksesuar" && product.group && product.group !== lastGroup) {
      const gtitle = document.createElement("div");
      gtitle.className = "subgroup-title";
      gtitle.textContent = product.group;
      listContainer.appendChild(gtitle);
      lastGroup = product.group;
    }

    const card = document.createElement("div");
    card.className = "product-card";

    const imgSrc = product.imageUrl || "https://via.placeholder.com/85?text=Hims";
    const linkUrl = product.productUrl || `https://www.elektromarketim.com/arama?q=${product.code}`;

    card.innerHTML = `
      <a href="${linkUrl}" target="_blank">
        <img src="${imgSrc}" class="product-img" alt="${product.code}" onerror="this.src='https://via.placeholder.com/85?text=Hims'">
      </a>
      <div class="product-info">
        <div class="product-code">${product.code}</div>
        <div class="product-desc">${product.desc}</div>
        <div class="prices">
          <div class="price-row">
            <span>Liste (KDV Hariç):</span>
            <span class="euro-price">${product.euroPrice} €</span>
          </div>
          <div class="price-row">
            <span>KDV Dahil Liste:</span>
            <span class="list-price-tl" id="list-tl-${index}">Hesaplanıyor...</span>
          </div>
          <div class="price-row separator">
            <span>Site Satış Fiyatı:</span>
            <span class="tl-price" id="site-price-${index}">Çekiliyor...</span>
          </div>
        </div>
        <div class="discount-section" id="discount-${index}" style="display: ${secretModeActive ? 'block' : 'none'};">
          <div class="discount-text">Hesaplanıyor...</div>
        </div>
      </div>
    `;
    listContainer.appendChild(card);
    updatePriceAndDiscount(product, index);
  });
}

function updatePriceAndDiscount(product, index) {
  const sitePrice = product.sitePrice;
  const listTLSpan = document.getElementById(`list-tl-${index}`);
  const sitePriceSpan = document.getElementById(`site-price-${index}`);
  const discountDiv = document.getElementById(`discount-${index}`);

  // KDV DAHİL liste fiyatı (TL) = Euro * Kur * 1.20
  const listPriceWithVAT_TL = product.euroPrice * currentEuroRate * KDV_ORANI;
  listTLSpan.innerText = `${listPriceWithVAT_TL.toFixed(2)} ₺`;

  if (sitePrice && sitePrice > 0) {
    sitePriceSpan.innerText = `${sitePrice.toFixed(2)} ₺`;
    // İskonto: KDV DAHİL liste fiyatı üzerinden
    const discountRate = ((listPriceWithVAT_TL - sitePrice) / listPriceWithVAT_TL) * 100;
    const color = discountRate > 0 ? "green" : "red";
    discountDiv.innerHTML = `
      <div style="font-size:0.8em; color:#555; margin-bottom:4px;">Kur: 1 € = ${currentEuroRate.toFixed(4)} ₺</div>
      <div class="discount-text" style="color: ${color};">
        İskonto Oranı: %${discountRate.toFixed(1)}
      </div>
    `;
  } else {
    sitePriceSpan.innerText = `STOKLARDA KALMAMIŞ`;
    sitePriceSpan.style.color = "#dc3545";
    discountDiv.innerHTML = `<div class="discount-text" style="color: #555;">Bu ürün şu anda stoklarda bulunmamaktadır.</div>`;
  }
}

// Başlat
fetchTCMBEuroRate();
</script>
